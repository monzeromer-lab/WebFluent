# Every action in .github/workflows is pinned to a commit, with its version
# in a comment. Dependabot moves both together, once a week, in one pull
# request, so a pin never goes stale and an update is always reviewed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
