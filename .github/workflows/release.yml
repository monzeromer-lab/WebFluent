name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Nothing is built for a tag that disagrees with the source: the crates'
  # versions, the release notes and the grammar the Zed extension pins.
  # `just preflight vX.Y.Z` runs the same check before tagging.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Zed extension pins its grammar by commit, which a shallow
          # clone does not have.
          fetch-depth: 0

      - name: The tag agrees with the source
        run: scripts/release-preflight.sh "${{ github.ref_name }}"

  build-linux:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `--workspace`, so the language server is built too: `cargo build` at
      # the root builds the root package alone.
      - name: Build release
        run: cargo build --release --workspace

      - name: Build .deb package
        run: |
          cargo install cargo-deb
          cargo deb --no-build

      # The `wf-lsp-<tag>-<arch>-<os>.tar.gz` name is what the Zed extension
      # asks a release for (editors/zed/src/webfluent.rs); keep them in step.
      - name: Create tarballs
        run: |
          mkdir -p dist
          tar czf dist/wf-${{ github.ref_name }}-x86_64-linux.tar.gz -C target/release wf
          tar czf dist/wf-lsp-${{ github.ref_name }}-x86_64-linux.tar.gz -C target/release wf-lsp

      - name: Collect artifacts
        run: |
          cp target/debian/*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  build-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --workspace

      - name: Install WiX and cargo-wix
        run: |
          dotnet tool install --global wix --version 5.0.2
          cargo install cargo-wix

      - name: Init WiX (generate wxs if missing)
        run: |
          if (!(Test-Path "wix\main.wxs")) { cargo wix init --package webfluent }

      - name: Build MSI
        run: cargo wix --package webfluent --no-build --nocapture

      - name: Create zips
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path target\release\wf.exe -DestinationPath dist\wf-${{ github.ref_name }}-x86_64-windows.zip
          Compress-Archive -Path target\release\wf-lsp.exe -DestinationPath dist\wf-lsp-${{ github.ref_name }}-x86_64-windows.zip

      - name: Collect MSI
        run: |
          Copy-Item target\wix\*.msi dist\

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  build-macos:
    needs: preflight
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Create tarballs
        run: |
          mkdir -p dist
          tar czf dist/wf-${{ github.ref_name }}-${{ matrix.arch }}-macos.tar.gz -C target/${{ matrix.target }}/release wf
          tar czf dist/wf-lsp-${{ github.ref_name }}-${{ matrix.arch }}-macos.tar.gz -C target/${{ matrix.target }}/release wf-lsp

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages-${{ matrix.arch }}
          path: dist/*

  # The VS Code extension, attached to every release so it installs from a
  # file (`Extensions: Install from VSIX…`) before, and besides, any
  # marketplace. Its version is its own, from editors/vscode/package.json.
  build-vscode:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Package
        run: |
          mkdir -p ../../dist
          npx vsce package --out "../../dist/webfluent-vscode-$(node -p 'require("./package.json").version').vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: dist/*.vsix

  release:
    needs: [build-linux, build-windows, build-macos, build-vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      # The page says what RELEASE_NOTES.md says, with GitHub's list of the
      # changes below it.
      - name: This release's notes
        run: scripts/release-notes.sh "${{ github.ref_name }}" > notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.msi
            dist/*.zip
            dist/*.vsix

  # After the release exists, so a crate is never published for a release
  # whose binaries failed to build. Without the `CARGO_REGISTRY_TOKEN`
  # secret it warns and passes; with it, a re-run is safe.
  publish-crate:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh "${{ github.ref_name }}"

  # The extension on the VS Code Marketplace and Open VSX. Each needs its own
  # token as a repository secret (`VSCE_PAT`, `OVSX_PAT`); without one that
  # step warns and passes. A version already published is skipped, so a
  # release that did not change the extension changes nothing there.
  publish-extension:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set, so the extension was not published to the VS Code Marketplace."
          else
            npx --yes @vscode/vsce publish --packagePath dist/*.vsix --skip-duplicate
          fi

      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set, so the extension was not published to Open VSX."
          else
            npx --yes ovsx publish dist/*.vsix --pat "$OVSX_PAT" --skip-duplicate
          fi
