# Everything that must hold before a change lands.
#
# There was no such workflow: only `release.yml`, which runs on a tag. That is
# why the language server sat broken through several refactors without anyone
# noticing — `cargo build` at the repository root builds the root package alone,
# so nothing in the repository ever compiled `crates/wf-lsp`. The `--workspace`
# flag below is the point of this file as much as the tests are.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Every job here reads the repository and writes nothing; a pull request's
# code never holds a token that can push, tag or release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # `release.yml` runs only when a tag is pushed, so a mistake in it would
  # first show halfway through a release. Its scripts and every workflow are
  # linted here instead, on every change.
  workflows:
    name: Workflows and release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A Python of its own: the runner's system Python refuses `pip install`.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install actionlint and shellcheck
        run: python -m pip install --quiet actionlint-py shellcheck-py

      - name: Lint
        run: |
          shellcheck scripts/*.sh
          actionlint .github/workflows/*.yml

  # Every dependency held to deny.toml: no RustSec advisory but the ones it
  # lists with a reason, only the licences it allows, crates.io alone.
  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # The crate's rust-version: the action's image brings an older one.
          rust-version: "1.92"

  # What only a real browser has — a service worker, WebRTC — is driven in a
  # real Chrome: `offline` (the site stored, served with the server gone, a
  # write kept and sent once, an update taken with one reload, pre-rendered
  # and as a single page), `peer` (two pages connecting, a message each
  # way, one seeing the other leave) and `scripts` (the project's own `.js`
  # called from `.wf`, `mount:`/`cleanup:` across an `if` and a route,
  # `Element`, `wf:render`, under the CSP). The runner has Chrome;
  # `puppeteer-core` drives it.
  browser:
    name: Offline, peers and scripts in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo build --release

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install
        working-directory: tests/browser
        run: npm ci --no-audit --no-fund

      - name: Offline
        working-directory: tests/browser
        run: node offline.mjs

      - name: Peers
        working-directory: tests/browser
        run: node peer.mjs

      - name: Scripts
        working-directory: tests/browser
        run: node scripts.mjs

      - name: Layers
        working-directory: tests/browser
        run: node layers.mjs

      - name: Keys
        working-directory: tests/browser
        run: node keys.mjs

      - name: Gestures
        working-directory: tests/browser
        run: node gestures.mjs

      - name: Storage
        working-directory: tests/browser
        run: node storage.mjs

      - name: Long lists
        working-directory: tests/browser
        run: node windowed.mjs

      - name: Workers
        working-directory: tests/browser
        run: node worker.mjs

      - name: Portals
        working-directory: tests/browser
        run: node portal.mjs

      - name: Pictures
        working-directory: tests/browser
        run: node pictures.mjs

      - name: Node ids
        working-directory: tests/browser
        run: node nodes.mjs

      - name: Motion
        working-directory: tests/browser
        run: node motion.mjs

      - name: Validation
        working-directory: tests/browser
        run: node validation.mjs

      - name: Plurals
        working-directory: tests/browser
        run: node plurals.mjs

      - name: Icons
        working-directory: tests/browser
        run: node icons.mjs

      - name: Controls
        working-directory: tests/browser
        run: node controls.mjs

      - name: Markdown
        working-directory: tests/browser
        run: node markdown.mjs

      - name: A store's resources
        working-directory: tests/browser
        run: node store_resource.mjs

      - name: A long session lets go
        working-directory: tests/browser
        run: node leaks.mjs

      - name: Where a page may send its reader
        working-directory: tests/browser
        run: node redirects.mjs

      - name: What a page writes from a value
        working-directory: tests/browser
        run: node output_security.mjs

      # What the compiler once compiled wrong, clicked and typed into.
      - name: Behaviour
        run: target/release/wf test tests/fixtures/behaviour

  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      # The grammar submodule: tests/docs_parse.rs holds its corpus to the
      # guide, and the printer reads its tests.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Formatting first: it is the cheapest failure to diagnose.
      - name: Formatting
        run: cargo fmt --all -- --check

      # `--workspace` so the language server is compiled, and `--all-targets` so
      # tests and examples are linted too. Warnings are errors here because the
      # tree is at zero and staying there is easier than getting back.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # What docs.rs builds, held to zero warnings: a broken link in the
      # crate's documentation is a page a reader lands on and cannot follow.
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # Covers the unit suites, the component conformance suite, the CSS
      # invariants, both end-to-end suites, and — through `e2e_rendered` — the
      # JavaScript suites that run the compiled bundles in a DOM.
      # `serve_and_verify` drives `wf verify` in the runner's Chrome; it
      # skips on a machine without one, and here that would be a failure.
      - name: Tests
        run: cargo test --workspace
        env:
          WF_REQUIRE_CHROME: "1"

      # `e2e_rendered` skips rather than fails when Node is absent, so run the
      # JavaScript suites directly too. A skip that nobody reads is a gap.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Every suite: the runtime modules, the network, stores, forms, motion,
      # security, interop and the cookbook's applications, on the builds the
      # Rust tests above wrote to target/. Only two of them ran here, and the
      # rest — 176 tests in all — were run by hand or not at all.
      - name: JavaScript suites
        run: node --test tests/js/*.test.mjs

      # The Node binding against the `wf` this job built: what `npm install
      # webfluent` hands a server.
      - name: Node binding
        run: WF_BIN="$PWD/target/debug/wf" node --test bindings/node/test.js

  scaffolds:
    name: Scaffolds build clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the compiler
        run: cargo build --release

      # Every template `wf init` writes must build without a warning. Twice now a
      # new lint has fired on the tool's own starting point, which teaches every
      # new user that warnings are noise.
      - name: Every template builds without warnings
        run: |
          set -euo pipefail
          mkdir -p /tmp/scaffolds && cd /tmp/scaffolds
          for template in spa static pdf slides; do
            "$GITHUB_WORKSPACE/target/release/wf" init "s_$template" -t "$template"
            test -s "s_$template/AGENTS.md" || { echo "::error::the $template scaffold has no AGENTS.md"; exit 1; }
            (cd "s_$template" \
              && "$GITHUB_WORKSPACE/target/release/wf" check --deny-warnings --format github \
              && "$GITHUB_WORKSPACE/target/release/wf" build) \
              || { echo "::error::the $template scaffold does not build clean"; exit 1; }
          done

      # The launch videos' projects: each builds clean, and `typo` fails with
      # the diagnostic its video shows. Same script as `just examples`.
      - name: Video examples build clean
        run: scripts/video-examples.sh "$GITHUB_WORKSPACE/target/release/wf"

      # The documentation site is a real WebFluent project; if the compiler
      # breaks it, the compiler is broken.
      - name: Documentation site builds
        run: cargo run --release -- build -d site --allow-output-outside

      # The printer and the smallest edit, over every project in the
      # repository: `cargo test` in a debug build reads a quarter of it.
      - name: Every statement prints back, every edit keeps the rest
        run: cargo test --release --test printer_corpus --test reprint_corpus

      # Every project in the repository, built, and what it wrote and what
      # the compiler said held to tests/golden/: a change that alters
      # either fails here, file by file. UPDATE_GOLDEN=1 writes them again
      # when the change is the point.
      - name: Every project builds to its golden manifest
        run: cargo test --release --test golden

  editors:
    name: Zed extension and grammar
    runs-on: ubuntu-latest
    steps:
      # Every editor is a submodule; this job checks the pinned commits still
      # agree with this compiler: the grammar parses everything here, the
      # queries compile, and the vocabularies match.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: editors/zed
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

      - name: Install the tree-sitter CLI
        run: just grammar-setup

      # `grammar-test` regenerates the parser first; a grammar.js change that
      # was committed without its generated parser.c shows up as a diff here,
      # since the parser Zed compiles is the committed one.
      - name: Grammar corpus, every .wf in the repo, queries, crate, vocabulary
        run: just zed-check

      - name: Generated parsers are committed
        run: git -C editors/tree-sitter-webfluent diff --exit-code -- webfluent/src webfluentx/src
