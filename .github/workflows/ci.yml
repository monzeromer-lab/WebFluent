# Everything that must hold before a change lands.
#
# There was no such workflow: only `release.yml`, which runs on a tag. That is
# why the language server sat broken through several refactors without anyone
# noticing — `cargo build` at the repository root builds the root package alone,
# so nothing in the repository ever compiled `crates/wf-lsp`. The `--workspace`
# flag below is the point of this file as much as the tests are.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # `release.yml` runs only when a tag is pushed, so a mistake in it would
  # first show halfway through a release. Its scripts and every workflow are
  # linted here instead, on every change.
  workflows:
    name: Workflows and release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A Python of its own: the runner's system Python refuses `pip install`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install actionlint and shellcheck
        run: python -m pip install --quiet actionlint-py shellcheck-py

      - name: Lint
        run: |
          shellcheck scripts/*.sh
          actionlint .github/workflows/*.yml

  # The VS Code extension, built and packaged as the marketplace would take
  # it. Its 0.2.0 package could not start — the language client was left out
  # of it — and nothing before this built or loaded what it carried.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

      # With the network: the latest release's server is downloaded and
      # answers `initialize`, as a reader's first start would do.
      - run: npm test
        env:
          WF_NETWORK_TESTS: "1"

      - run: npx vsce package --out webfluent.vsix

  # What only a real browser has — a service worker, WebRTC — is driven in a
  # real Chrome: `offline` (the site stored, served with the server gone, a
  # write kept and sent once, an update taken with one reload, pre-rendered
  # and as a single page) and `peer` (two pages connecting, a message each
  # way, one seeing the other leave). The runner has Chrome;
  # `puppeteer-core` drives it.
  browser:
    name: Offline and peers in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install
        working-directory: tests/browser
        run: npm ci --no-audit --no-fund

      - name: Offline
        working-directory: tests/browser
        run: node offline.mjs

      - name: Peers
        working-directory: tests/browser
        run: node peer.mjs

  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting first: it is the cheapest failure to diagnose.
      - name: Formatting
        run: cargo fmt --all -- --check

      # `--workspace` so the language server is compiled, and `--all-targets` so
      # tests and examples are linted too. Warnings are errors here because the
      # tree is at zero and staying there is easier than getting back.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # Covers the unit suites, the component conformance suite, the CSS
      # invariants, both end-to-end suites, and — through `e2e_rendered` — the
      # JavaScript suites that run the compiled bundles in a DOM.
      - name: Tests
        run: cargo test --workspace

      # `e2e_rendered` skips rather than fails when Node is absent, so run the
      # JavaScript suites directly too. A skip that nobody reads is a gap.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Every suite: the runtime modules, the network, stores, forms, motion,
      # security, interop and the cookbook's applications, on the builds the
      # Rust tests above wrote to target/. Only two of them ran here, and the
      # rest — 176 tests in all — were run by hand or not at all.
      - name: JavaScript suites
        run: node --test tests/js/*.test.mjs

  scaffolds:
    name: Scaffolds build clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the compiler
        run: cargo build --release

      # Every template `wf init` writes must build without a warning. Twice now a
      # new lint has fired on the tool's own starting point, which teaches every
      # new user that warnings are noise.
      - name: Every template builds without warnings
        run: |
          set -euo pipefail
          mkdir -p /tmp/scaffolds && cd /tmp/scaffolds
          for template in spa static pdf slides; do
            "$GITHUB_WORKSPACE/target/release/wf" init "s_$template" -t "$template"
            output=$(cd "s_$template" && "$GITHUB_WORKSPACE/target/release/wf" build 2>&1)
            echo "$output"
            if echo "$output" | grep -q 'Warning \['; then
              echo "::error::the $template scaffold does not build clean"
              exit 1
            fi
          done

      # The documentation site is a real WebFluent project; if the compiler
      # breaks it, the compiler is broken.
      - name: Documentation site builds
        run: cargo run --release -- build -d site

  editors:
    name: Zed extension and grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: extractions/setup-just@v2

      - name: Install the tree-sitter CLI
        run: just grammar-setup

      # `grammar-test` regenerates the parser first; a grammar.js change that
      # was committed without its generated parser.c shows up as a diff here,
      # since the parser Zed compiles is the committed one.
      - name: Grammar corpus, every .wf in the repo, queries, crate, vocabulary
        run: just zed-check

      - name: Generated parser is committed
        run: git diff --exit-code -- editors/tree-sitter-webfluent/src
