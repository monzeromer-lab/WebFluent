<!doctype html>
<!-- The README's hero: one source, three outputs. scripts/showcase.py --hero
     photographs this at 1600x900 beside the pictures it names, which it makes
     from the real outputs: web.png (the Halyard report's project built as a
     site), pdf.png (page 1 of the PDF the same project builds) and slide.png
     (slide 1 of the review deck made from the same numbers). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("Inter.ttf"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("JetBrainsMono.ttf"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: #17191C;
    background: #F9FAFB;
    background-image: radial-gradient(circle at 1px 1px, #E2E5E8 1px, transparent 0);
    background-size: 24px 24px;
    padding: 56px 60px 0;
  }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .mark { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .mark b { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 5px; background: #2B5178; color: #fff; font: 500 14px "JetBrains Mono", monospace; }
  .mark span { font-size: 18px; font-weight: 600; }
  .overline { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #0D6274; margin-bottom: 10px; }
  h1 { font-size: 46px; line-height: 52px; font-weight: 800; letter-spacing: -0.022em; max-width: 900px; }
  .cmd { font: 500 15px/22px "JetBrains Mono", monospace; color: #E6E9EC; background: #1B1F22; border-radius: 8px; padding: 14px 18px; white-space: pre; }
  .cmd i { font-style: normal; color: #959BA1; }
  .cmd em { font-style: normal; color: #7FD6A8; }
  .row { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 44px; }
  figure { display: flex; flex-direction: column; gap: 14px; }
  figcaption { display: flex; align-items: baseline; gap: 10px; font-size: 16px; font-weight: 600; }
  figcaption code { font: 500 13px "JetBrains Mono", monospace; color: #2B5178; background: #E7EEF6; border: 1px solid #C9D7E6; border-radius: 999px; padding: 2px 10px; }
  .browser { width: 600px; height: 500px; border: 1px solid #C9CED3; border-radius: 10px; overflow: hidden; background: #0B0C0E; box-shadow: 0 4px 8px rgba(23,25,28,.06), 0 16px 40px rgba(23,25,28,.16); display: flex; flex-direction: column; }
  .bar { flex: none; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #EEF0F2; border-bottom: 1px solid #D5D9DD; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #C9CED3; }
  .bar span { margin-left: 14px; flex: 1; height: 24px; border-radius: 5px; background: #fff; font: 12px/24px "JetBrains Mono", monospace; color: #5A5F64; padding: 0 10px; }
  .browser img { width: 560px; margin: 0 20px; display: block; }
  .paper { width: 354px; height: 500px; display: block; box-shadow: 0 4px 8px rgba(23,25,28,.06), 0 16px 40px rgba(23,25,28,.18); }
  .slide { width: 470px; height: 264px; display: block; border-radius: 6px; box-shadow: 0 4px 8px rgba(23,25,28,.06), 0 16px 40px rgba(23,25,28,.18); }
</style>
</head>
<body>
  <header>
    <div>
      <div class="mark"><b>wf</b><span>WebFluent</span></div>
      <p class="overline">One source · three outputs</p>
      <h1>The same quarter, as a web page, a PDF and a slide deck.</h1>
    </div>
    <div class="cmd"><i>$</i> wf build   <i># "output_type":</i> <em>"spa"</em>
<i>$</i> wf build   <i># "output_type":</i> <em>"pdf"</em>
<i>$</i> wf build   <i># "output_type":</i> <em>"slides"</em></div>
  </header>
  <div class="row">
    <figure>
      <div class="browser">
        <div class="bar"><i></i><i></i><i></i><span>halyard.example.com</span></div>
        <img src="web.png" alt="">
      </div>
      <figcaption>Web page <code>"spa"</code></figcaption>
    </figure>
    <figure>
      <img class="paper" src="pdf.png" alt="">
      <figcaption>PDF, page 1 of {{PDF_PAGES}} <code>"pdf"</code></figcaption>
    </figure>
    <figure>
      <img class="slide" src="slide.png" alt="">
      <figcaption>Slide 1 of {{SLIDES}} <code>"slides"</code></figcaption>
    </figure>
  </div>
</body>
</html>
