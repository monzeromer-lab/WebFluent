<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171B1F"/>
      <stop offset="1" stop-color="#0E1113"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#2B5178" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2B5178" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- the mark and the name -->
  <rect x="72" y="72" width="56" height="56" rx="10" fill="#2B5178"/>
  <text x="100" y="109" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="26" letter-spacing="-1" fill="#FFFFFF">wf</text>
  <text x="146" y="111" font-family="Lato" font-weight="900" font-size="34" fill="#F2F4F6">WebFluent</text>

  <!-- the claim -->
  <text x="72" y="208" font-family="JetBrains Mono" font-weight="500" font-size="19" letter-spacing="2.5" fill="#6FD3E6">ONE BINARY · ONE LANGUAGE</text>
  <text font-family="Lato" font-weight="900" font-size="76" letter-spacing="-2" fill="#FFFFFF">
    <tspan x="68" y="292">A language</tspan>
    <tspan x="68" y="374">for websites.</tspan>
  </text>
  <text font-family="Lato" font-weight="400" font-size="27" fill="#A9B0B6">
    <tspan x="72" y="438">One file says what a page shows. The</tspan>
    <tspan x="72" y="474">compiler makes it a site, an app, a PDF</tspan>
    <tspan x="72" y="510">or a slide deck.</tspan>
  </text>
  <text x="72" y="570" font-family="JetBrains Mono" font-weight="500" font-size="20" fill="#7D848B">monzeromer-lab.github.io/WebFluent</text>

  <!-- a page, as it is written -->
  <g transform="translate(652 150)">
    <rect x="0" y="0" width="476" height="332" rx="14" fill="#1B1F22" stroke="#343A40" stroke-width="1.5"/>
    <path d="M14 0H462A14 14 0 0 1 476 14V44H0V14A14 14 0 0 1 14 0Z" fill="#23282C"/>
    <line x1="0" y1="44" x2="476" y2="44" stroke="#343A40" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="6" fill="#4A5157"/>
    <circle cx="44" cy="22" r="6" fill="#4A5157"/>
    <circle cx="64" cy="22" r="6" fill="#4A5157"/>
    <text x="92" y="28" font-family="JetBrains Mono" font-size="15" fill="#959BA1">src/pages/Home.wf</text>
    <g font-family="JetBrains Mono" font-size="17.5" fill="#B3BAC0" xml:space="preserve">
      <text x="24" y="84"><tspan fill="#8FBDE7">page</tspan> <tspan fill="#6FD3E6">Home</tspan>(path: <tspan fill="#7FD6A8">"/"</tspan>) {</text>
      <text x="24" y="114">    <tspan fill="#8FBDE7">state</tspan> count = <tspan fill="#E0B070">0</tspan></text>
      <text x="24" y="156">    <tspan fill="#6FD3E6">Heading</tspan>(<tspan fill="#7FD6A8">"Hello, world"</tspan>).h1</text>
      <text x="24" y="186">    <tspan fill="#6FD3E6">Text</tspan>(<tspan fill="#7FD6A8">"Clicked {count} times"</tspan>)</text>
      <text x="24" y="228">    <tspan fill="#6FD3E6">Button</tspan>(<tspan fill="#7FD6A8">"Click me"</tspan>).primary {</text>
      <text x="24" y="258">        <tspan fill="#8FBDE7">on</tspan> click { count = count + <tspan fill="#E0B070">1</tspan> }</text>
      <text x="24" y="288">    }</text>
      <text x="24" y="318">}</text>
    </g>
  </g>
</svg>
