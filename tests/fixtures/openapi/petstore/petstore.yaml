# A small pet shop, in the shape every OpenAPI tool's first example has.
openapi: "3.0.3"
info:
  title: Pet shop
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: http://petstore.example.com/v1
tags:
  - name: pets
    description: Everything about the animals for sale.
paths:
  /pets:
    get:
      summary: Every pet, a few at a time
      operationId: listPets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          description: How many to answer with (at most 100).
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: Where the next page is
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Put a pet up for sale
      operationId: createPets
      tags:
        - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '201':
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      summary: One pet, by its id
      operationId: showPetById
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to show
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
              example: { id: 1, name: Rex, tag: dog }
        '404':
          description: No pet has that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Pet:
      description: >
        An animal for sale: its id, its name, and the kind of animal it is
        when the shop has said.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
          description: |
            A word for the kind of animal.
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
