<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <meta name="description" content="How to reach us.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact">
    <meta property="og:site_name" content="static">
    <meta property="og:description" content="How to reach us.">
    <meta property="og:locale" content="en">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Contact">
    <meta name="twitter:description" content="How to reach us.">
    <link rel="stylesheet" href="../styles.css">
    <script src="../app.js" defer></script>
    <script src="../pages/Contact.js" data-wf-page="Contact" defer></script>
</head>
<body>
    <a class="wf-skip-link" href="#wf-main">Skip to content</a>
    <div id="app">
        <nav aria-label="Main" class="wf-navbar">
            <div class="wf-navbar__brand">
                <p class="wf-text wf-text--heading">static</p>
            </div>
            <div class="wf-navbar__links">
                <a class="wf-link" href="/">
                    <p class="wf-text">Home</p>
                </a>
                <a class="wf-link" href="/about">
                    <p class="wf-text">About</p>
                </a>
                <a class="wf-link" href="/blog">
                    <p class="wf-text">Blog</p>
                </a>
                <a class="wf-link active" href="/contact" aria-current="page">
                    <p class="wf-text">Contact</p>
                </a>
            </div>
            <div class="wf-navbar__actions">
                <button class="wf-btn wf-btn--small">EN</button>
                <button class="wf-btn wf-btn--small">AR</button>
            </div>
        </nav>
        <main id="wf-main">
            <div class="wf-container wf-animate-fadeIn">
                <h1 class="wf-heading">Contact Us</h1>
                <p class="wf-text wf-text--muted">We would love to hear from you.</p>
                <div class="wf-spacer"></div>
                <div class="wf-row wf-gap--lg">
                    <div class="wf-col">
                        <div class="wf-card wf-card--elevated">
                            <div class="wf-card__body">
                                <div style="display:none">
                                <div role="status" class="wf-alert wf-alert--success">Thank you! Your message has been sent.</div>
                                <div class="wf-spacer"></div>
                                </div>
                                <form class="wf-form">
                                    <div class="wf-field">
                                        <input class="wf-input" required type="text" id="wf-field-1">
                                    </div>
                                    <div class="wf-spacer wf-spacer--sm"></div>
                                    <div class="wf-field">
                                        <input class="wf-input" required id="wf-field-2">
                                    </div>
                                    <div class="wf-spacer wf-spacer--sm"></div>
                                    <div class="wf-field">
                                        <select class="wf-select" id="wf-field-3">
                                        <option value="general">General Inquiry</option>
                                        <option value="support">Support</option>
                                        <option value="feedback">Feedback</option>
                                    </select>
                                    </div>
                                    <div class="wf-spacer wf-spacer--sm"></div>
                                    <div class="wf-field">
                                        <input class="wf-input" type="text" id="wf-field-4">
                                    </div>
                                    <div class="wf-spacer"></div>
                                    <label class="wf-checkbox"></label>
                                    <div class="wf-spacer"></div>
                                    <button class="wf-btn wf-btn--primary wf-btn--large wf-btn--full">Send Message</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="wf-col">
                        <div class="wf-card">
                            <div class="wf-card__body">
                                <h2 class="wf-heading">Info</h2>
                                <div class="wf-spacer wf-spacer--sm"></div>
                                <div class="wf-stack wf-gap--sm">
                                    <p class="wf-text">hello@example.com</p>
                                    <p class="wf-text">+1 (555) 123-4567</p>
                                    <p class="wf-text">123 Main Street</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="wf-footer"></footer>
    </div>
</body>
</html>
