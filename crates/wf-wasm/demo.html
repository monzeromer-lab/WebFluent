<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebFluent in the browser</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --ink: #1a1a19; --muted: #6b6b66; --line: #e3e3de;
    --err: #b42318; --warn: #a15c07; --ok: #067647; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --panel: #1b1b1a; --ink: #ecece8; --muted: #9a9a93; --line: #2c2c2a;
            --err: #f97066; --warn: #fdb022; --ok: #47cd89; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  #status { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  select, .bar button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 8px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); height: calc(100vh - 49px); }
  section { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .bar button { cursor: pointer; background: none; }
  .bar button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
  textarea { flex: 1; border: 0; resize: none; padding: 12px; font: 13px/1.5 var(--mono); background: var(--panel); color: var(--ink); outline: none; tab-size: 4; }
  iframe { flex: 1; border: 0; background: #fff; }
  #diagnostics { list-style: none; margin: 0; padding: 0; max-height: 35%; overflow: auto; border-top: 1px solid var(--line); }
  #diagnostics li { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  #diagnostics code { font-family: var(--mono); font-weight: 600; }
  .error code { color: var(--err); } .warning code { color: var(--warn); }
  #diagnostics .where { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  #diagnostics .none { color: var(--ok); }
  pre { flex: 1; margin: 0; padding: 12px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } section { min-height: 50vh; } }
</style>
</head>
<body>
<header>
  <h1>WebFluent, compiled in this page</h1>
  <label>Example <select id="example"></select></label>
  <p>The real compiler as WebAssembly. Nothing is sent anywhere.</p>
  <span id="status">loading the compiler…</span>
</header>
<main>
  <section>
    <div class="bar" role="tablist" id="sources"></div>
    <textarea id="editor" spellcheck="false" aria-label="Source"></textarea>
  </section>
  <section>
    <div class="bar" role="tablist" id="outputs"></div>
    <iframe id="preview" title="Preview" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    <pre id="code" hidden></pre>
    <ul id="diagnostics" aria-live="polite"></ul>
  </section>
</main>
<script type="module">
import { compile, preview, previewConfig, version, preload } from "./wf.js";

const SHELL = `app {
    Navbar {
        Navbar.Brand { Link("Ledger", to: "/") }
        Navbar.Links {
            Link("Home", to: "/")
            Link("About", to: "/about")
        }
    }
    Router
}
`;

// A picture drawn here, so the example needs no file: the build sizes it
// and writes WebP beside it.
async function picture() {
  const canvas = new OffscreenCanvas(1600, 900);
  const g = canvas.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 1600, 900);
  grad.addColorStop(0, "#0F766E"); grad.addColorStop(1, "#1E3A8A");
  g.fillStyle = grad; g.fillRect(0, 0, 1600, 900);
  for (let i = 0; i < 400; i++) {
    g.fillStyle = `hsla(${(i * 37) % 360}, 70%, 70%, 0.35)`;
    g.beginPath(); g.arc((i * 997) % 1600, (i * 613) % 900, 10 + (i % 40), 0, Math.PI * 2); g.fill();
  }
  const blob = await canvas.convertToBlob({ type: "image/png" });
  return new Uint8Array(await blob.arrayBuffer());
}

const EXAMPLES = {
  "A site of two pages": {
    config: { name: "Ledger" },
    files: {
      "src/App.wf": SHELL,
      "src/pages/Home.wf": `page Home(path: "/", title: "Counter", description: "A counter.") {
    state count = 0

    Container {
        Heading("Counter").h1
        Text("Count: {count}")
        Row(gap: .sm) {
            Button("+1").primary { on click { count = count + 1 } }
            Button("Reset") { on click { count = 0 } }
        }
    }
}
`,
      "src/pages/About.wf": `page About(path: "/about", title: "About", description: "Who we are.") {
    Container {
        Heading("About").h1
        Text("This page is its own chunk, served by the preview's worker.")
        Link("Back to the counter", to: "/")
    }
}
`,
    },
  },
  "A picture (WebP)": {
    config: { name: "Picture" },
    files: async () => ({
      "src/pages/Home.wf": `page Home(path: "/", title: "Picture", description: "A picture, sized.") {
    Container {
        Heading("A picture").h1
        Image(src: "/hero.png", alt: "Circles on a gradient", sizes: "(max-width: 768px) 100vw, 800px", placeholder: .blur)
        Text("The build wrote it as WebP at every width it needs.").muted
    }
}
`,
      "public/hero.png": await picture(),
    }),
  },
  "A PDF report": {
    config: { name: "Report", build: { output_type: "pdf" } },
    files: {
      "src/pages/Report.wf": `const SALES = [
    { month: "Jan", web: 41, store: 22 },
    { month: "Feb", web: 48, store: 25 },
    { month: "Mar", web: 53, store: 24 },
]

page Report(path: "/", title: "Report") {
    Document(size: "A4", title: "Q1 report", author: "Company Inc.") {
        Footer { Text("Page {page} of {pages}").muted.sm.center }
        Heading("Q1 Report").h1
        Text("Revenue grew 15% this quarter.")
        Text("نما الدخل بنسبة ١٥٪ هذا الربع.")
        Chart(kind: .bar, data: SALES, x: "month", y: ["web", "store"], unit: "k")
        Table {
            Table.Head { Table.Row { Table.Cell("Month")  Table.Cell("Web") } }
            Table.Body {
                for s in SALES { Table.Row { Table.Cell(s.month)  Table.Cell("{s.web}k") } }
            }
        }
        QrCode("https://webfluent.monzeromer.dev")
    }
}
`,
    },
  },
  "A slide deck": {
    config: { name: "Deck", build: { output_type: "slides", slides: { show_slide_numbers: true } } },
    files: {
      "src/pages/Deck.wf": `page Deck(path: "/", title: "Q1 Review") {
    Presentation {
        TitleSlide("Q1 Review", subtitle: "Company Inc. — March 2026")
        SectionSlide("Numbers").primary
        Slide {
            Heading("Highlights").h1
            List {
                List.Item { Text("Launched 3 new products") }
                List.Item { Text("Revenue grew 15%") }
            }
        }
    }
}
`,
    },
  },
};

const $ = (id) => document.getElementById(id);
let files = {};
let config = "";
let isDocument = false;
let current = "";
let view = "preview";
let last = null;
let pdfUrl = null;

function tabs(el, names, selected, pick) {
  el.replaceChildren(...names.map((name) => {
    const b = document.createElement("button");
    b.textContent = name.replace(/^src\//, "");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(name === selected));
    b.onclick = () => pick(name);
    return b;
  }));
}

const editable = () => Object.keys(files).filter((p) => typeof files[p] === "string");

function showSources() {
  tabs($("sources"), editable(), current, (name) => {
    current = name; $("editor").value = files[name]; showSources();
  });
}

function showOutputs() {
  const names = ["preview", ...(last ? [...Object.keys(last.files), ...Object.keys(last.binary)] : [])];
  tabs($("outputs"), names, view, (name) => { view = name; render(); });
}

async function render() {
  showOutputs();
  const out = last;
  $("preview").hidden = view !== "preview";
  $("code").hidden = view === "preview";
  if (view !== "preview") {
    const bytes = out?.binary[view];
    $("code").textContent = out?.files[view] ?? (bytes ? `${bytes.length} bytes` : "");
  } else if (out?.ok) {
    const pdf = Object.entries(out.binary).find(([p]) => p.endsWith(".pdf"));
    if (pdf) {
      if (pdfUrl) URL.revokeObjectURL(pdfUrl);
      pdfUrl = URL.createObjectURL(new Blob([pdf[1]], { type: "application/pdf" }));
      $("preview").removeAttribute("sandbox");
      $("preview").src = pdfUrl;
    } else {
      $("preview").setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
      $("preview").src = await preview(out);
    }
  }
  const list = $("diagnostics");
  if (!out) return;
  const items = out.diagnostics.map((d) => {
    const li = document.createElement("li");
    li.className = d.severity;
    li.innerHTML = `<code></code> <span class="msg"></span><div class="where"></div>`;
    li.querySelector("code").textContent = d.code;
    li.querySelector(".msg").textContent = d.message;
    li.querySelector(".where").textContent =
      `${d.file.replace(/^\/wf-project\//, "")}:${d.line}:${d.column}` + (d.hint ? ` — ${d.hint}` : "");
    return li;
  });
  for (const line of out.lines.filter((l) => /note:|PDF:|Slides:/.test(l))) {
    const li = document.createElement("li");
    li.textContent = line.trim();
    items.push(li);
  }
  if (out.error && out.diagnostics.length === 0) {
    const li = document.createElement("li");
    li.className = "error";
    li.textContent = out.error;
    items.push(li);
  }
  if (items.length === 0) items.push(Object.assign(document.createElement("li"), { className: "none", textContent: "No problems." }));
  list.replaceChildren(...items);
}

let building = Promise.resolve();
function build() {
  building = building.then(async () => {
    const t = performance.now();
    last = await compile(files, config);
    const ms = Math.round(performance.now() - t);
    const errors = last.diagnostics.filter((d) => d.severity === "error").length;
    const warnings = last.diagnostics.filter((d) => d.severity === "warning").length;
    $("status").textContent = `wf ${await version()} · ${ms} ms · ${errors} error(s), ${warnings} warning(s)`;
    if (view !== "preview" && !(view in last.files) && !(view in last.binary)) view = "preview";
    await render();
  }).catch((e) => { $("status").textContent = String(e); console.error(e); });
  return building;
}

async function choose(name) {
  const example = EXAMPLES[name];
  files = typeof example.files === "function" ? await example.files() : { ...example.files };
  isDocument = ["pdf", "slides"].includes(example.config.build?.output_type);
  // A site is previewed by the worker under `preview/`; its pages ask for
  // their files there.
  config = isDocument ? JSON.stringify(example.config) : previewConfig(example.config);
  current = editable().find((p) => p.includes("pages/")) ?? editable()[0];
  view = "preview";
  showSources();
  $("editor").value = files[current];
  if (isDocument) $("status").textContent = "loading the PDF engine and its fonts…";
  await build();
}

let timer;
$("editor").addEventListener("input", (e) => {
  files[current] = e.target.value;
  clearTimeout(timer);
  timer = setTimeout(build, 200);
});

$("example").replaceChildren(...Object.keys(EXAMPLES).map((n) => new Option(n, n)));
$("example").addEventListener("change", (e) => choose(e.target.value));

const t = performance.now();
await preload();
$("status").textContent = `compiler loaded in ${Math.round(performance.now() - t)} ms`;
await choose(Object.keys(EXAMPLES)[0]);
window.wfDemo = { compile, choose, get files() { return files; }, get last() { return last; } };
</script>
</body>
</html>
