[package]
name = "wf-wasm"
version.workspace = true
edition.workspace = true
description = "The WebFluent compiler as WebAssembly, for a playground that compiles in the browser"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The PDF and slide-deck renderer. Its fonts are not built in: the page
# hands them over with `register_font` (`build.sh` puts them in
# `pkg-pdf/fonts/`), so they are fetched once, apart, and cached.
pdf = ["webfluent/pdf"]

[dependencies]
# The compiler without the `wf` command. libwebp (C) is in: `build.sh`
# compiles it against the libc in `libc/`.
webfluent = { path = "../..", default-features = false, features = ["webp", "internals"] }
wasm-bindgen = "=0.2.130"
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The maths libwebp calls (`pow`, `log`, `expf`, …), in Rust.
libm = "0.2"

[build-dependencies]
cc = "1"

[lints]
workspace = true
