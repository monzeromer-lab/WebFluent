[package]
name = "wf-lsp"
version.workspace = true
edition.workspace = true
description = "Language Server Protocol implementation for WebFluent"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "wf_lsp"
path = "src/lib.rs"

[[bin]]
name = "wf-lsp"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The server: JSON-RPC over stdio, on an async runtime. Without it the crate
# is the analysis alone — completion, hover, diagnostics, definitions,
# symbols, rename, code actions — for a program that links it and calls it
# directly.
server = ["dep:tower-lsp", "dep:tokio"]

[dependencies]
webfluent = { path = "../.." }
# The version tower-lsp 0.20 re-exports, so the types are the same with the
# server and without it.
lsp-types = "0.94.1"
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
serde_json.workspace = true
dashmap = "6"

[lints]
workspace = true
