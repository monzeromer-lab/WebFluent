[package]
name = "webfluent"
version = "5.14.0"
edition = "2024"
description = "A language for websites, PDFs and slide decks. One binary, no Node: HTML, CSS and JavaScript, PDFs from its own layout engine, and a template engine for Rust."
authors = ["Monzer Omer <monzer.a.omer@gmail.com>"]
license = "MPL-2.0"
repository = "https://github.com/monzeromer-lab/WebFluent"
homepage = "https://webfluent.monzeromer.dev"
documentation = "https://docs.rs/webfluent"
readme = "README.md"

# What a `cargo install webfluent` does not need. `editors/` holds the
# editor extensions and the tree-sitter grammars as submodules, each its own
# repository; `docs/` is the built documentation site. Neither is used to
# build or run the compiler, and together they were most of a 15.6 MB
# package that crates.io kept timing out on.
exclude = [
    "/editors",
    "/docs",
    "/site",
    "/dist",
    "/tests",
    "/.github",
    "/.claude",
    # The reference documents and the fonts they are set in: tests and
    # examples, not the compiler.
    "/examples/documents",
]
keywords = ["web", "language", "compiler", "template-engine", "pdf"]
categories = ["compilers", "template-engine", "web-programming"]
rust-version = "1.92"

[package.metadata.deb]
maintainer = "Monzer Omer"
copyright = "2026 Monzer Omer"
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
    ["target/release/wf", "usr/bin/", "755"],
]
extended-description = "A programming language that compiles to HTML, CSS, and JavaScript. Built-in components, reactivity, routing, i18n, animations, and SSG."

[lib]
name = "webfluent"
path = "src/lib.rs"

[[bin]]
name = "wf"
path = "src/main.rs"
required-features = ["cli"]

# `cli` is the `wf` command: its argument parser and the dev server. A
# program that only renders templates leaves it out —
# `webfluent = { version = "5", default-features = false }` — and builds
# the compiler and the template engine alone.
[features]
default = ["cli"]
cli = ["dep:clap", "dep:tiny_http"]
# A native build does everything. A WebAssembly build — `crates/wf-wasm`,
# which a page downloads before it compiles anything — carries each of these
# only when asked (see build.rs):
# lossy WebP, through libwebp (C; `crates/wf-wasm/build.sh` compiles it);
webp = ["dep:webp"]
# the PDF and slide-deck renderer;
pdf = []
# and the Liberation faces built in (2.4 MB). Without them a page hands them
# over at run time (`paged::fonts::register_font`).
bundled-fonts = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webp = { version = "0.3.1", default-features = false }

[workspace]
members = [".", "crates/wf-lsp", "crates/wf-wasm"]
exclude = ["editors/zed"]

# BeautifulRust's lint set (github.com/morganlinton/BeautifulRust,
# lints/lints.toml), with clippy.toml beside this file. A lint the code
# already satisfies is on, so CI (`clippy -- -D warnings`) holds it there.
# A lint with findings is held at "allow" with today's count beside it, and
# switched to "warn" the day its count reaches zero; scripts/lint-debt.sh
# prints every count.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "allow"          # 58
missing_docs = "allow"                           # 1570
unreachable_pub = "allow"                        # 1697
rust_2018_idioms = { level = "allow", priority = -1 }  # 93

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }    # 2600, the group together
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
dbg_macro = "warn"
todo = "warn"
expect_used = "allow"
unwrap_used = "allow"                            # 380
panic_in_result_fn = "allow"                     # 1
missing_panics_doc = "allow"                     # 16
missing_errors_doc = "allow"                     # 152
missing_assert_message = "allow"                 # 4
allow_attributes = "allow"                       # 2, tests/common: shared helpers an expect cannot cover
allow_attributes_without_reason = "warn"
fn_params_excessive_bools = "allow"              # 104
struct_excessive_bools = "allow"                 # 7
clone_on_ref_ptr = "allow"                       # 38
redundant_clone = "allow"                        # 28
rc_buffer = "allow"                              # 6
exhaustive_enums = "allow"                       # 103
string_add = "allow"                             # 41
wildcard_imports = "allow"                       # 47
print_stdout = "allow"                           # 183, nearly all the CLI's own output
print_stderr = "allow"                           # 24
as_conversions = "allow"                         # 981
cast_possible_truncation = "allow"               # 262
cast_sign_loss = "allow"                         # 86
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.0", features = ["derive"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tiny_http = { version = "0.12.0", optional = true }
# Regex literals evaluated at build time, in the static paint and the template engine.
regex = "1"
# The image pipeline: decoding, resizing and re-encoding four formats is not
# work worth doing by hand, and a wrong colour profile or a mis-decoded
# progressive JPEG is the kind of bug that never ends. The hand-written PDF
# writer and gzip encoder stay as they are.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Lossy WebP at `build.media.quality`: `image`'s own WebP encoder is
# lossless only, and a lossless WebP of a photograph is larger than the
# picture it replaces. libwebp is built from its source with `cc`, so it
# builds wherever the compiler does, Android included. Always in a native
# build; in a WebAssembly one with the `webp` feature.
webp = { version = "0.3.1", default-features = false, optional = true }
# Paged output (PDF documents and slide decks). Layout, shaping and writing a
# correct PDF are each a project of their own; these are the pure-Rust crates
# Typst's own PDF export is built on.
krilla = "0.8"
krilla-svg = "0.8"
usvg = { version = "0.47", default-features = false, features = ["text"] }
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-bidi = "0.3"
unicode-ident = "1"
unicode-normalization = "0.1"
unicode-linebreak = "0.1"
fontdb = "0.23"
miniz_oxide = "0.8"
qrcode = { version = "0.14", default-features = false }

# The WebAssembly compiler (`crates/wf-wasm`) is downloaded by a page before
# it compiles anything, so it is built for size: `cargo build --profile
# wasm-release`. The native release profile is untouched.
[dev-dependencies]
# The golden-output test hashes every file a build writes.
sha2 = "0.10"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false
