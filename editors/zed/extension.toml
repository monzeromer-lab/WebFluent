id = "webfluent"
name = "WebFluent"
description = "WebFluent language support for .wf and .wfx files: syntax highlighting, outline, bracket matching, auto-indent, snippets, and the wf-lsp language server (diagnostics, completions, hover, go to definition, code actions)."
version = "3.0.0"
schema_version = 1
authors = ["Monzer Omer <monzer.a.omer@gmail.com>"]
repository = "https://github.com/monzeromer-lab/WebFluent"
snippets = ["snippets/webfluent.json"]

# The grammar lives in this repository, under `editors/tree-sitter-webfluent`.
# Zed clones the repository at `rev` and compiles `path/src/parser.c`, so
# `rev` must be a commit that already contains the grammar you want — bump
# it after the grammar changes land (`just zed-pin-grammar`).
[grammars.webfluent]
repository = "https://github.com/monzeromer-lab/WebFluent"
rev = "a680de3c6af57c54c77d82a185e85719d787b945"
path = "editors/tree-sitter-webfluent"

# The indented layout, `.wfx`: the same grammar generated with its layout
# tokens on, from the same commit.
[grammars.webfluentx]
repository = "https://github.com/monzeromer-lab/WebFluent"
rev = "a680de3c6af57c54c77d82a185e85719d787b945"
path = "editors/tree-sitter-webfluentx"

[language_servers.wf-lsp]
name = "WebFluent Language Server"
languages = ["WebFluent", "WebFluent (indented)"]
code_action_kinds = ["quickfix"]
